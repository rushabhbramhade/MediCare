[project]
name = "medicare-ai"
version = "0.1.0"
description = "Medicare iCare AI service — symptom guidance and medical report explanation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  # Local Tesseract OCR (no paid API key).
  "pytesseract>=0.3,<1",
  "pdf2image>=1.17,<2",
  "pypdf>=5,<6",
  "Pillow>=10,<11",
  "opencv-python-headless>=4,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
