name: Bug report
description: Report something that is broken or misleading
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real patient data, phone numbers, tokens or report text.
        For a security issue, do not open a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs actual behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, whether Docker/Supabase were configured.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - ai
        - workers
        - database
        - infrastructure
        - docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, personal data and report content first.
      render: shell
