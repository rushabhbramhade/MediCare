name: medicare

# Local development dependencies only. App processes run on the host via pnpm
# so hot reload and debuggers work normally. See infrastructure/deployment.
services:
  postgres:
    build:
      context: ../..
      dockerfile: infrastructure/docker/postgres/Dockerfile
    image: medicare-postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicare_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-medicare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
